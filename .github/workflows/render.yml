name: Render Video

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Nama folder video di public/ (contoh: video1)"
        required: true
        default: "video1"
      scale:
        description: "Skala render: 1 = 1080x1920, 0.75 = 810x1440, 0.5 = 540x960"
        required: true
        default: "0.75"

permissions:
  contents: read

concurrency:
  group: render-${{ github.event.inputs.video }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VIDEO: ${{ github.event.inputs.video }}
      SCALE: ${{ github.event.inputs.scale }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pengganti setup-ffmpeg (penyebab "fetch failed"), dengan retry
      - name: Pasang ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            for i in 1 2 3; do
              sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break
              echo "Percobaan $i gagal, coba lagi..."; sleep 5
            done
          fi
          ffmpeg -version | head -1

      - name: Pasang font emoji
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji

      - name: Pasang dependensi Python
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install numpy scipy
          fi

      - name: Pasang dependensi npm
        run: npm install --no-audit --no-fund

      - name: Cache browser Remotion
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Validasi input
        run: |
          if ! echo "$SCALE" | grep -Eq '^(0?\.[0-9]+|1(\.0+)?)$'; then
            echo "Scale tidak valid: $SCALE (isi 0.5, 0.75, atau 1)"; exit 1
          fi
          if [ ! -d "public/$VIDEO" ]; then
            echo "Folder public/$VIDEO tidak ditemukan"; exit 1
          fi

      # Jaring pengaman: ubah tab jadi 4 spasi HANYA di runner (tidak di-commit)
      - name: Normalkan indentasi Python
        run: |
          sed -i 's/\t/    /g' tools/*.py
          python3 -m py_compile tools/*.py

      - name: Validasi scenes.src.json + mp3/srt
        run: python3 tools/validate_scenes.py "$VIDEO"

      - name: Unduh gambar objek (visuals)
        continue-on-error: true
        run: python3 tools/visualize.py "$VIDEO"

      - name: Siapkan (timing SRT, lip-sync, musik, SFX)
        run: python3 tools/prepare.py "$VIDEO"

      - name: Render
        run: |
          mkdir -p out
          echo "{\"name\":\"$VIDEO\"}" > props.json
          npx remotion render src/index.ts Cerita "out/$VIDEO.mp4" \
            --props=props.json --crf=23 --scale="$SCALE" \
            --concurrency=2 --log=verbose

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.video }}
          path: out/*.mp4
          retention-days: 7
          if-no-files-found: error
